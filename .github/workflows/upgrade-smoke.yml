name: Published 0.2.4 to 0.2.5 upgrade smoke
on:
  push:
    branches: [test/upgrade-smoke-025]
permissions:
  contents: read
jobs:
  upgrade:
    timeout-minutes: 30
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        api: [30, 35]
    steps:
      - uses: actions/checkout@v5
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Download published release assets via the API
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p out
          for t in v0.2.4 v0.2.5; do
            gh api repos/${{ github.repository }}/releases/tags/$t --jq '.assets[] | [.name,.browser_download_url,.size,.digest] | @tsv' | tee -a out/assets.txt
            url=$(gh api repos/${{ github.repository }}/releases/tags/$t --jq '.assets[0].browser_download_url')
            curl -fL --retry 3 -o out/$t.apk "$url"
          done
          sha256sum out/*.apk | tee out/sha.txt
      - name: Upgrade smoke
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: bash scripts/upgrade-smoke.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: upgrade-smoke-api${{ matrix.api }}
          path: out/
