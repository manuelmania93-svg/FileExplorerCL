name: Verify index-first and hold actions
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        api: [30, 35]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and unit tests
        run: ./gradlew assembleDebug testDebugUnitTest assembleDebugAndroidTest
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Real holds, process restart, and large mixed-file benchmark
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: SFE_TEST_API=${{ matrix.api }} bash scripts/verify-index-hold.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Index-hold-validation-${{ matrix.api }}
          path: |
            app/build/reports/
            app/build/outputs/androidTest-results/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: File-Explorer-Control-PR-only-APK-${{ matrix.api }}
          path: app/build/outputs/apk/debug/app-debug.apk
