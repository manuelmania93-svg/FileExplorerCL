name: Stable 0.2.2 release verification
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  release:
    timeout-minutes: 30
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0
      - uses: gradle/actions/setup-gradle@v4
      - name: Restore permanent private signing key
        env:
          SFE_KEYSTORE_BASE64: ${{ secrets.SFE_KEYSTORE_BASE64 }}
          SFE_KEYSTORE_PASSWORD: ${{ secrets.SFE_KEYSTORE_PASSWORD }}
          SFE_KEY_ALIAS: ${{ secrets.SFE_KEY_ALIAS }}
        run: |
          test -n "$SFE_KEYSTORE_BASE64" && test -n "$SFE_KEYSTORE_PASSWORD" && test -n "$SFE_KEY_ALIAS"
          umask 077
          printf '%s' "$SFE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/sfe-signing.p12"
          echo "SFE_KEYSTORE_PATH=$RUNNER_TEMP/sfe-signing.p12" >> "$GITHUB_ENV"
          printf 'SFE_KEYSTORE_PASSWORD=%s\n' "$SFE_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          printf 'SFE_KEY_ALIAS=%s\n' "$SFE_KEY_ALIAS" >> "$GITHUB_ENV"
      - name: Stable signed build and unit tests
        run: ./gradlew assembleDebug assembleDebugAndroidTest testDebugUnitTest
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Stable signed gestures and actual 0.2.1 upgrade
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: bash scripts/verify-release-022.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: File-Explorer-Control-0.2.2-APK
          path: app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Release-0.2.2-verification
          path: app/build/reports/
      - name: Remove runner signing-key copy
        if: always()
        run: rm -f "$RUNNER_TEMP/sfe-signing.p12"
